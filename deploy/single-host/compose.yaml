name: ${COMPOSE_PROJECT_NAME:-draftmatter-alpha}

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }

x-restricted: &restricted
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  restart: unless-stopped
  logging: *logging

services:
  initialize:
    image: postgres:18.7-alpine
    user: '0:0'
    network_mode: none
    entrypoint: [sh, /initialize.sh]
    volumes:
      - ${DM_SINGLE_HOST_DIR:?Set DM_SINGLE_HOST_DIR}/tls:/source:ro
      - ./initialize-volumes.sh:/initialize.sh:ro
      - certificates:/certificates
      - object-data:/object-data
    security_opt: [no-new-privileges:true]
    read_only: true
    logging: *logging

  postgres:
    <<: *restricted
    # PostgreSQL runs as PID 1; root tini cannot signal UID 70 with all capabilities dropped.
    init: false
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: draftmatter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DM_DB_PASSWORD: ${DM_DB_PASSWORD:?Set DM_DB_PASSWORD}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/draftmatter-tls/postgres.crt, -c, ssl_key_file=/run/draftmatter-tls/postgres.key, -c, hba_file=/etc/postgresql/pg_hba.conf, -c, shared_buffers=128MB, -c, max_connections=60]
    volumes:
      - postgres-data:/var/lib/postgresql
      - certificates:/run/draftmatter-tls:ro
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-draftmatter.sh:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    depends_on:
      initialize: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d draftmatter']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [database]
    # The official entrypoint initializes ownership before dropping to postgres.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m", "/var/run/postgresql:rw,nosuid,size=16m"]
    mem_limit: 1g
    stop_grace_period: 60s

  object-storage:
    <<: *restricted
    image: chrislusf/seaweedfs:4.29
    user: '1000:1000'
    command: [mini, '-dir=/data', '-bucket=draftmatter', '-admin.ui=false', '-webdav=false', '-s3.port.iceberg=0', '-s3.iam=false', '-s3.config=/etc/seaweedfs/s3.json', '-s3.cert.file=/run/draftmatter-tls/objects.crt', '-s3.key.file=/run/draftmatter-tls/objects.key', '-s3.port.https=8334', '-s3.concurrentUploadLimitMB=64', '-filer.concurrentUploadLimitMB=64', '-volume.concurrentUploadLimitMB=64', '-volume.index=leveldb', '-master.telemetry=false']
    volumes:
      - object-data:/data
      - certificates:/run/draftmatter-tls:ro
      - ${DM_SINGLE_HOST_DIR:?Set DM_SINGLE_HOST_DIR}/s3.json:/etc/seaweedfs/s3.json:ro
    depends_on:
      initialize: { condition: service_completed_successfully }
    networks: [objects]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    mem_limit: 1g
    stop_grace_period: 60s

  keycloak:
    <<: *restricted
    image: quay.io/keycloak/keycloak:26.7.0
    command: [start, --import-realm, --http-enabled=true, --proxy-headers=xforwarded, --health-enabled=true, --metrics-enabled=false]
    environment:
      KC_HOSTNAME: ${AUTH_ORIGIN:?Set AUTH_ORIGIN}
      KC_HOSTNAME_STRICT: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak?sslmode=verify-full&sslrootcert=/run/draftmatter-tls/ca.crt
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD}
      KC_DB_POOL_INITIAL_SIZE: '2'
      KC_DB_POOL_MIN_SIZE: '2'
      KC_DB_POOL_MAX_SIZE: '10'
      JAVA_OPTS_APPEND: -Xms128m -Xmx512m
    volumes:
      - certificates:/run/draftmatter-tls:ro
      - ${DM_SINGLE_HOST_DIR:?Set DM_SINGLE_HOST_DIR}/realm.json:/opt/keycloak/data/import/draftmatter.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [database, identity]
    tmpfs: ["/tmp:rw,nosuid,size=128m"]
    mem_limit: 1g
    stop_grace_period: 60s

  collaboration:
    <<: *restricted
    image: draftmatter-collaboration:${RELEASE_ID:?Set RELEASE_ID}
    build: { context: ../.., dockerfile: Dockerfile }
    environment:
      NODE_ENV: production
      NODE_EXTRA_CA_CERTS: /run/draftmatter-tls/ca.crt
      DM_ADDRESS: 0.0.0.0
      DM_PORT: '1234'
      DM_DATABASE_URL: ${DM_DATABASE_URL:?Set DM_DATABASE_URL}
      DM_DATABASE_TLS: verify-full
      DM_OBJECT_BUCKET: draftmatter
      DM_OBJECT_REGION: eu-local
      DM_OBJECT_ENDPOINT: https://object-storage:8334
      DM_OBJECT_FORCE_PATH_STYLE: 'true'
      DM_OBJECT_PREFIX: draftmatter
      DM_OBJECT_ACCESS_KEY: ${DM_OBJECT_ACCESS_KEY:?Set DM_OBJECT_ACCESS_KEY}
      DM_OBJECT_SECRET_KEY: ${DM_OBJECT_SECRET_KEY:?Set DM_OBJECT_SECRET_KEY}
      DM_OIDC_ISSUER: ${DM_OIDC_ISSUER:?Set DM_OIDC_ISSUER}
      DM_OIDC_JWKS_URI: ${DM_OIDC_JWKS_URI:?Set DM_OIDC_JWKS_URI}
      DM_OIDC_AUDIENCE: draftmatter-collaboration
      DM_OIDC_CLIENT_ID: draftmatter-public
      DM_ALLOWED_ORIGINS: ${DM_ALLOWED_ORIGINS:?Set DM_ALLOWED_ORIGINS}
      DM_WEBHOOK_SECRET: ${DM_WEBHOOK_SECRET:?Set DM_WEBHOOK_SECRET}
      DM_PROJECT_FILES_TOTAL_QUOTA_BYTES: ${DM_PROJECT_FILES_TOTAL_QUOTA_BYTES:-25000000000}
      DM_MAINTENANCE_INTERVAL_MS: '3600000'
    volumes:
      - certificates:/run/draftmatter-tls:ro
    depends_on:
      postgres: { condition: service_healthy }
      object-storage: { condition: service_started }
      edge: { condition: service_started }
    networks: [database, objects, frontend]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    mem_limit: 1g
    stop_grace_period: 30s
    # Dependencies can take longer than the Node process to start.
    healthcheck:
      start_period: 120s

  edge:
    <<: *restricted
    image: draftmatter-web:${RELEASE_ID:?Set RELEASE_ID}
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.web
      args:
        VITE_DRAFTMATTER_COLLABORATION_URL: ${COLLABORATION_ORIGIN:?Set COLLABORATION_ORIGIN}
        VITE_DM_LEGAL_PUBLISHER_NAME: ${DM_LEGAL_PUBLISHER_NAME:?Set DM_LEGAL_PUBLISHER_NAME}
        VITE_DM_LEGAL_CONTACT_EMAIL: ${DM_LEGAL_CONTACT_EMAIL:?Set DM_LEGAL_CONTACT_EMAIL}
        VITE_DM_LEGAL_HOSTING_DETAILS: ${DM_LEGAL_HOSTING_DETAILS:?Set DM_LEGAL_HOSTING_DETAILS}
        VITE_DM_LEGAL_DATA_LOCATION: ${DM_LEGAL_DATA_LOCATION:?Set DM_LEGAL_DATA_LOCATION}
        VITE_DM_LEGAL_ADDITIONAL_PROCESSORS: ${DM_LEGAL_ADDITIONAL_PROCESSORS:?Set DM_LEGAL_ADDITIONAL_PROCESSORS}
    command: [caddy, run, --config, /etc/caddy/single-host.Caddyfile, --adapter, caddyfile]
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:${HTTP_PORT:-80}
      - ${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:${HTTPS_PORT:-443}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - certificates:/run/draftmatter-tls:ro
      - ${DM_SINGLE_HOST_DIR:?Set DM_SINGLE_HOST_DIR}/Caddyfile:/etc/caddy/single-host.Caddyfile:ro
    depends_on:
      initialize: { condition: service_completed_successfully }
      keycloak: { condition: service_started }
    networks:
      frontend:
        aliases: ["${APP_HOST:?Set APP_HOST}", "${COLLABORATION_HOST:?Set COLLABORATION_HOST}", "${AUTH_HOST:?Set AUTH_HOST}"]
      identity:
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    # Only this network namespace permits the non-root proxy to bind 80/443.
    sysctls: { net.ipv4.ip_unprivileged_port_start: '0' }
    mem_limit: 256m
    stop_grace_period: 30s

volumes:
  postgres-data:
  object-data:
  certificates:
  caddy-data:
  caddy-config:

networks:
  frontend:
  database: { internal: true }
  objects: { internal: true }
  identity: { internal: true }
