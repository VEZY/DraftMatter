[package]
name = "draftmatter"
version = "0.1.0"
description = "The local-first research writing environment"
authors = ["DraftMatter contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[lib]
name = "draftmatter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"
