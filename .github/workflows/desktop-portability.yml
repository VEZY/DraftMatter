name: Desktop portability

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --debug --bundles deb
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --debug
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --debug --target aarch64-apple-darwin
          - label: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --debug --target x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check frontend types
        run: npm run check

      - name: Enforce dependency licence allowlist
        run: npm run compliance:check

      - name: Generate platform notices and CycloneDX SBOM
        run: npm run compliance:generate

      - name: Test frontend and host adapter
        run: npm test

      - name: Run article-sized alpha dogfood gate
        run: npm run test:alpha

      - name: Build standalone clean-export CLI
        run: npm run build:cli

      - name: Test standalone clean-export CLI
        run: npm run test:cli

      - name: Verify local agent protocol, adapters, skill, and MCP
        run: |
          npm run test:mcp
          npm run test:agent-adapters
          npm run test:agent-performance
          npm run validate:agent-skill

      - name: Test native project host
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build local agent execution host
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --bin draftmatter-agent-host

      - name: Build platform application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: draftmatter-[platform]-[arch]-[bundle]

      - name: Upload platform compliance inventory
        uses: actions/upload-artifact@v6
        with:
          name: draftmatter-${{ matrix.target }}-compliance
          path: |
            compliance/THIRD_PARTY_NOTICES.md
            compliance/sbom.cdx.json
