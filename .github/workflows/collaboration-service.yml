name: Collaboration service

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: collaboration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test collaboration service
        run: npm test

      - name: Build browser and service bundles
        run: npm run build

      - name: Validate portable Compose topology
        run: docker compose config --quiet

      - name: Build non-root service image
        run: docker build --tag draftmatter-collaboration:${{ github.sha }} .
