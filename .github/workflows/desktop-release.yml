name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install locked dependencies
        run: npm ci

      - name: Install the pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Verify release version identity
        run: npm run release:verify

      - name: Check locked dependencies for high and critical advisories
        run: npm audit --audit-level=high

      - name: Run browser, service, build, and compliance gates
        run: npm run test:release

      - name: Run native host tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  signing-policy:
    runs-on: ubuntu-22.04
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      APPLE_ID: ${{ secrets.APPLE_ID != '' }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT != '' }}
    steps:
      - name: Require signing and notarization credentials for version tags
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Manual build: unsigned release-candidate policy applies."
            exit 0
          fi
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD WINDOWS_CERTIFICATE_THUMBPRINT; do
            if [[ "${!name}" != true ]]; then
              echo "::error::Required protected release secret $name is not configured."
              missing=1
            fi
          done
          exit "$missing"

  cli:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test standalone clean-export CLI
        run: |
          npm run build:cli
          npm run test:cli

      - name: Package platform-neutral CLI
        run: |
          mkdir release-cli
          npm pack ./dist-cli --pack-destination release-cli

      - name: Upload CLI release artifact
        uses: actions/upload-artifact@v6
        with:
          name: draftmatter-cli
          path: release-cli/draftmatter-*.tgz

  build:
    needs: [verify, signing-policy]
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64 release
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bunTarget: bun-linux-x64
            args: --target x86_64-unknown-linux-gnu --bundles deb,appimage
          - label: Windows x64 release
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bunTarget: bun-windows-x64
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - label: macOS Apple Silicon release
            platform: macos-latest
            target: aarch64-apple-darwin
            bunTarget: bun-darwin-arm64
            args: --target aarch64-apple-darwin --bundles app,dmg
          - label: macOS Intel release
            platform: macos-latest
            target: x86_64-apple-darwin
            bunTarget: bun-darwin-x64
            args: --target x86_64-apple-darwin --bundles app,dmg

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: release-${{ matrix.target }}

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release version identity
        run: npm run release:verify

      - name: Generate platform compliance inventory
        env:
          DRAFTMATTER_COMPLIANCE_TARGET: ${{ matrix.target }}
        run: npm run compliance:generate

      - name: Build platform local-agent execution host
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --target ${{ matrix.target }} --bin draftmatter-agent-host

      - name: Build bundled MCP and execution-host sidecars
        run: |
          npm run build:cli
          npm run build:desktop-sidecars -- ${{ matrix.target }} ${{ matrix.bunTarget }}

      - name: Prepare release configuration
        run: >-
          node -e "require('node:fs').writeFileSync('src-tauri/tauri.release.conf.json', JSON.stringify({ bundle: { externalBin: ['binaries/draftmatter-mcp', 'binaries/draftmatter-agent-host'], windows: { nsis: { installerHooks: './windows/installer-hooks.nsh' } } } }, null, 2))"

      - name: Import Windows Authenticode certificate
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'draftmatter-release.pfx'
          $thumbprint = ($env:WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($thumbprint -notmatch '^[A-F0-9]{40}$') { throw 'Expected the SHA-1 certificate thumbprint (40 hex characters).' }
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          } finally {
            if (Test-Path $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }
          }
          $certificate = Get-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint"
          if (-not $certificate.HasPrivateKey) { throw 'The selected signing certificate must contain its private key.' }
          $config = @{ bundle = @{ externalBin = @('binaries/draftmatter-mcp', 'binaries/draftmatter-agent-host'); windows = @{ certificateThumbprint = $thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com'; tsp = $true; nsis = @{ installerHooks = './windows/installer-hooks.nsh' } } } }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'src-tauri/tauri.release.conf.json'

      - name: Build unsigned release candidate bundles
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: draftmatter-candidate-[platform]-[arch]-[bundle]

      - name: Build signed release bundles into a draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: DraftMatter ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          releaseAssetNamePattern: DraftMatter_[version]_[platform]_[arch]_[bundle][ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: draftmatter-[platform]-[arch]-[bundle]

      - name: Verify macOS Developer ID signature and notarization
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/notarize-release-dmg.sh "${{ matrix.target }}" "src-tauri/target/${{ matrix.target }}/release/bundle"

      - name: Replace the workflow DMG with its stapled copy
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v6
        with:
          name: draftmatter-darwin-${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x64' }}-dmg
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          overwrite: true
          if-no-files-found: error

      - name: Verify Windows Authenticode signatures
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $bundleRoot = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $sdk = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $signTool = Get-ChildItem -Path (Join-Path $sdk 'bin\10.*\x64\signtool.exe') -File |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'SignTool was not found in the Windows 10/11 SDK.' }
          $thumbprint = ($env:WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          foreach ($pattern in 'nsis/*.exe', 'msi/*.msi') {
            $bundles = @(Get-ChildItem -Path (Join-Path $bundleRoot $pattern) -File)
            if ($bundles.Count -eq 0) { throw "Missing required installer: $pattern" }
            foreach ($bundle in $bundles) {
              & $signTool.FullName verify /pa /all /tw /v $bundle.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($bundle.Name)" }
              $signature = Get-AuthenticodeSignature -LiteralPath $bundle.FullName
              if ($signature.SignerCertificate.Thumbprint -ne $thumbprint) { throw "Unexpected signer for $($bundle.Name)" }
            }
          }

      - name: Upload platform compliance inventory
        uses: actions/upload-artifact@v6
        with:
          name: draftmatter-${{ matrix.target }}-compliance
          path: |
            compliance/THIRD_PARTY_NOTICES.md
            compliance/sbom.cdx.json
          if-no-files-found: error

      - name: Upload platform local-agent execution host
        uses: actions/upload-artifact@v6
        with:
          name: draftmatter-${{ matrix.target }}-agent-host
          path: |
            src-tauri/target/${{ matrix.target }}/release/draftmatter-agent-host
            src-tauri/target/${{ matrix.target }}/release/draftmatter-agent-host.exe
          if-no-files-found: error

  release-metadata:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, cli]
    runs-on: ubuntu-22.04
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - uses: actions/download-artifact@v7
        with:
          pattern: 'draftmatter-{cli,*-compliance,*-agent-host}'
          path: release-assets

      - name: Prepare checksums over the actual installer and metadata filenames
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern 'DraftMatter_*' --dir release-installers
          node scripts/prepare-release-metadata.mjs release-assets release-installers release-metadata

      - name: Attach verified release metadata
        run: gh release upload "$GITHUB_REF_NAME" release-metadata/* --clobber
