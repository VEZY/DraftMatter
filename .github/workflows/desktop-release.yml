name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version for a local-download candidate
        type: string
        required: false
  workflow_call:
    inputs:
      version:
        type: string
        required: false
env:
  DESKTOP_RELEASE_VERSION: ${{ inputs.version }}

concurrency:
  group: desktop-build-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install locked dependencies
        run: npm ci

      - name: Install the pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Verify checkout version identity
        run: npm run release:verify

      - name: Stage and verify the requested desktop version
        run: |
          node scripts/prepare-desktop-release.mjs stage-version
          npm run release:verify

      - name: Check locked dependencies for high and critical advisories
        run: npm audit --audit-level=high

      - name: Run browser, service, build, and compliance gates
        run: npm run test:release

      - name: Run native host tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  cli:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Stage the requested desktop version
        run: node scripts/prepare-desktop-release.mjs stage-version

      - name: Build and test standalone clean-export CLI
        run: |
          npm run build:cli
          npm run test:cli

      - name: Package platform-neutral CLI
        run: |
          mkdir release-cli
          npm pack ./dist-cli --pack-destination release-cli

      - name: Upload CLI release artifact
        uses: actions/upload-artifact@v6
        with:
          name: draftmatter-cli
          path: release-cli/draftmatter-*.tgz

  build:
    needs: verify
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64 release
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bunTarget: bun-linux-x64
            args: --target x86_64-unknown-linux-gnu --bundles deb,appimage
          - label: Linux ARM64 release
            platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bunTarget: bun-linux-arm64
            args: --verbose --target aarch64-unknown-linux-gnu --bundles deb,appimage
          - label: Windows ARM64 release
            platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            bunVersion: 1.3.10
            bunTarget: bun-windows-arm64
            args: --target aarch64-pc-windows-msvc --bundles nsis
          - label: Windows x64 release
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bunTarget: bun-windows-x64
            args: --verbose --target x86_64-pc-windows-msvc --bundles nsis,msi
          - label: macOS Apple Silicon release
            platform: macos-latest
            target: aarch64-apple-darwin
            bunTarget: bun-darwin-arm64
            args: --target aarch64-apple-darwin --bundles app,dmg
          - label: macOS Intel release
            platform: macos-15-intel
            target: x86_64-apple-darwin
            bunTarget: bun-darwin-x64
            args: --target x86_64-apple-darwin --bundles app,dmg

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bunVersion || '1.3.8' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: release-${{ matrix.target }}

      - name: Install locked dependencies
        run: npm ci

      - name: Verify checkout version identity
        run: npm run release:verify

      - name: Stage and verify the requested desktop version
        run: |
          node scripts/prepare-desktop-release.mjs stage-version
          npm run release:verify

      - name: Generate platform compliance inventory
        env:
          DRAFTMATTER_COMPLIANCE_TARGET: ${{ matrix.target }}
        run: npm run compliance:generate

      - name: Build platform local-agent execution host
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --target ${{ matrix.target }} --bin draftmatter-agent-host

      - name: Build bundled MCP sidecar
        run: |
          npm run build:cli
          npm run build:desktop-sidecars -- ${{ matrix.target }} ${{ matrix.bunTarget }}

      - name: Prepare release configuration
        run: node scripts/prepare-desktop-release.mjs config

      - name: Preserve the standalone MCP executable in the ARM64 AppImage
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "PATCHELF=$GITHUB_WORKSPACE/scripts/appimage-arm64-patchelf.sh" >> "$GITHUB_ENV"

      - name: Build unsigned release candidate bundles
        run: npm run desktop:build -- ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Verify the ad hoc app inside the release DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/verify-release-dmg.sh "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" "${{ matrix.target }}"

      - name: Verify Windows installer signatures and MSI executable inventory
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-release-windows.ps1 -BundleRoot "src-tauri/target/${{ matrix.target }}/release/bundle" -Target "${{ matrix.target }}"

      - name: Apply Debian prerelease ordering and verify Debian and AppImage packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          bash scripts/version-debian-package.sh "$bundle/deb"
          bash scripts/verify-release-linux.sh "$bundle" "${{ matrix.target }}"

      - name: Keep the generated WiX manifest after a Windows packaging failure
        if: failure() && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: draftmatter-wix-manifest-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/wix/x64/main.wxs
          if-no-files-found: ignore

      - name: Collect verified installable packages under their download names
        run: node scripts/prepare-desktop-release.mjs stage-installers ${{ matrix.target }} release-installers

      - name: Upload checked installers
        uses: actions/upload-artifact@v6
        with:
          name: draftmatter-installers-${{ matrix.target }}
          path: release-installers/
          if-no-files-found: error

      - name: Upload platform compliance inventory
        uses: actions/upload-artifact@v6
        with:
          name: draftmatter-${{ matrix.target }}-compliance
          path: |
            compliance/THIRD_PARTY_NOTICES.md
            compliance/sbom.cdx.json
          if-no-files-found: error

      - name: Upload platform local-agent execution host
        uses: actions/upload-artifact@v6
        with:
          name: draftmatter-${{ matrix.target }}-agent-host
          path: |
            src-tauri/target/${{ matrix.target }}/release/draftmatter-agent-host
            src-tauri/target/${{ matrix.target }}/release/draftmatter-agent-host.exe
          if-no-files-found: error

  release-metadata:
    needs: [build, cli]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@v7
        with:
          pattern: 'draftmatter-{cli,*-compliance,*-agent-host}'
          path: release-extras
      - uses: actions/download-artifact@v7
        with:
          pattern: draftmatter-installers-*
          merge-multiple: true
          path: release-installers
      - name: Verify completeness and checksum the actual release files
        run: node scripts/prepare-release-metadata.mjs release-extras release-installers release-desktop
      - uses: actions/upload-artifact@v6
        with:
          name: draftmatter-desktop-release
          path: release-desktop/
          if-no-files-found: error
