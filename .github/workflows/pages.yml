name: DraftMatter website

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - '.node-version'
      - 'public/**'
      - 'src/HomeLearningGuide.tsx'
      - 'src/HomeShowcase.tsx'
      - 'src/Icon.tsx'
      - 'src/home.css'
      - 'website/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.website.json'
      - 'vite.website.config.ts'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build website
        env:
          VITE_ALPHA_SIGNUP_URL: ${{ vars.DRAFTMATTER_ALPHA_SIGNUP_URL }}
        run: npm run build:website

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-website

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
